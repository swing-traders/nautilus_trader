# Builds the patched v1 wheel and, on a version tag, publishes it as a GitHub release.
# Runs on ubuntu-22.04 (glibc 2.35) so the wheel loads on the Debian 13 (glibc 2.41)
# production image; the workstation installs the same artifact.
name: build-patched-wheel

on:
  push:
    tags: ["v1.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel (release)
        env:
          BUILD_MODE: release
        run: |
          python -m pip install --quiet uv==0.11.33
          uv build --wheel
          ls -la dist/

      - name: Verify platform tag and checksum
        run: |
          wheel=$(ls dist/nautilus_trader-*.whl)
          case "$wheel" in
            *manylinux_2_3[0-5]*) echo "platform tag ok: $wheel" ;;
            *) echo "::error::wheel $wheel is not manylinux_2_35 or older — it will not load on the production image"; exit 1 ;;
          esac
          (cd dist && sha256sum "$(basename "$wheel")" > "$(basename "$wheel").sha256" && cat *.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/nautilus_trader-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/nautilus_trader-*
          fail_on_unmatched_files: true
